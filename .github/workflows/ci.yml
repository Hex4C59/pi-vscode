name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  extension:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm run lint
      - run: npm test

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/docs/docs-i18n-check.spec.mjs scripts/docs/docs-verify.spec.mjs scripts/docs/docs-health.spec.mjs
      - run: npm run docs:verify
