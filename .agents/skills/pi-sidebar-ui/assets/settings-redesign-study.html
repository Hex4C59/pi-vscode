<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pi · 设置结构研究</title>
<!-- Isolated, in-memory design study in the existing visual-reference library. Not production UI. -->
<style>
:root{color-scheme:dark;--bg:#191919;--panel:#202020;--raised:#292929;--text:#dedede;--muted:#949494;--line:#343434;--strong:#5b5b5b;--hover:#303030;--focus:#c6c6c6;--sidebar:320px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body[data-theme=light]{color-scheme:light;--bg:#f4f4f4;--panel:#fff;--raised:#f0f0f0;--text:#252525;--muted:#666;--line:#dedede;--strong:#aaa;--hover:#e9e9e9;--focus:#333}body[data-theme=contrast]{--bg:#000;--panel:#080808;--raised:#111;--text:#fff;--muted:#ccc;--line:#aaa;--strong:#fff;--hover:#292929;--focus:#ff0}
button,select,input,textarea{font:inherit;color:inherit}button,select{cursor:pointer}button{background:none;border:0;border-radius:6px;padding:8px 12px}button:hover{background:var(--hover)}button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--focus);outline-offset:2px}select,input{background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:8px 12px;max-width:100%}button:disabled{opacity:.5;cursor:default}a{color:inherit}h1,h2,h3,p{margin:0}h1{font-size:18px;font-weight:600}h2{font-size:15px;font-weight:600}h3{font-size:12px;font-weight:500;color:var(--muted)}small,.muted{color:var(--muted);font-size:12px}.icon{width:16px;height:16px;flex:none;opacity:.8}body:not([data-theme=light]) .icon{filter:invert(1)}.iconbtn{display:inline-flex;align-items:center;justify-content:center;padding:8px}.line{border-top:1px solid var(--line)}
.study{max-width:1320px;margin:auto;padding:24px 24px 100px}.study-head{display:flex;align-items:end;justify-content:space-between;gap:24px;margin-bottom:24px}.study-title{display:grid;gap:8px}.study-controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.study-controls select{padding:4px 8px;font-size:12px}.eyebrow{font-size:12px;color:var(--muted)}.frame{display:grid;grid-template-columns:minmax(0,1fr) var(--sidebar);border:1px solid var(--line);border-radius:8px;overflow:hidden;height:700px;max-height:calc(100dvh - 220px);min-height:480px;background:var(--panel)}.editor{min-width:0;display:flex;flex-direction:column;background:var(--bg)}.tabs{height:40px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);font-size:12px;flex:none}.tab{display:flex;align-items:center;gap:12px;padding:8px 16px;color:var(--muted);border-right:1px solid var(--line)}.tab.active{background:var(--panel);color:var(--text)}.editor-layout{display:grid;grid-template-columns:156px minmax(0,1fr);flex:1;min-height:0;background:var(--panel)}.nav{padding:24px 12px;border-right:1px solid var(--line)}.nav h2{padding:0 12px 24px}.nav button{width:100%;text-align:left;margin-bottom:4px;display:flex;align-items:center;gap:8px}.nav button[aria-current=page]{background:var(--hover)}.content{padding:32px;overflow:auto;min-width:0}.content>header{margin-bottom:24px;display:flex;gap:12px;align-items:center}.section{margin-bottom:24px}.section>h3{margin-bottom:12px}.row{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}.row:last-child{border-bottom:0}.row .copy{min-width:0;display:grid;gap:4px}.row .value{display:flex;gap:8px;align-items:center;color:var(--muted);min-width:0}.row select{max-width:60%}.setting-link{width:100%;border-radius:0;text-align:left}.setting-link:hover{background:none}.setting-link:hover .value{color:var(--text)}.primary{background:var(--text);color:var(--panel)}.primary:hover{background:var(--muted)}.secondary{border:1px solid var(--line)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:24px}.empty-space{padding:24px 0}.hero-value{font-size:18px;margin:8px 0 24px;font-weight:500}.selection{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:12px;margin:4px 0}.selection .copy{display:grid;gap:4px;flex:1;min-width:0}.selection[aria-pressed=true]{background:var(--hover)}.selection .mark{width:16px;visibility:hidden}.selection[aria-pressed=true] .mark{visibility:visible}.search{width:100%;margin-bottom:16px}.provider-name{display:flex;align-items:center;gap:12px;min-width:0}.monogram{width:32px;height:32px;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:15px}.provider-detail{display:grid;gap:16px}.status{font-size:12px;color:var(--muted)}.notice{font-size:12px;color:var(--muted);margin-top:16px}.code{padding:32px;color:var(--muted);font:13px/2 ui-monospace,monospace;white-space:pre-wrap}.code .bright{color:var(--text)}
.sidebar{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative;min-width:0}.side-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 12px;min-height:48px;flex:none}.side-head .leading{display:flex;align-items:center;gap:8px;min-width:0}.chat-body{padding:24px 16px;flex:1;overflow:auto;display:flex;flex-direction:column;gap:24px}.message{padding:12px;background:var(--raised);border-radius:8px}.reply{line-height:1.8}.draft{margin:12px;border:1px solid var(--strong);border-radius:8px;padding:12px}.draft textarea{width:100%;resize:none;border:0;background:none;outline:none;height:64px}.draft-tools{display:flex;gap:4px;flex-wrap:wrap;align-items:center}.draft-tools button{font-size:12px;padding:4px 8px;display:flex;gap:4px;align-items:center}.draft-tools .send{margin-left:auto;background:var(--raised)}.footnote{padding:0 16px 12px;font-size:12px;color:var(--muted)}.side-content{padding:16px;overflow:auto;flex:1;min-height:0}.side-content .row{gap:12px}.side-content>header{margin-bottom:24px}.side-content .row select{max-width:58%}.side-content .hero-value{font-size:15px}.side-content .selection{padding:12px 8px}.overview-link{display:flex;width:100%;text-align:left;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);border-radius:0}.overview-link .copy{display:grid;gap:4px}.overview-link:last-child{border:0}.sidebar .page-title{margin:16px 0 24px;font-size:18px}.menu{position:absolute;bottom:144px;left:12px;right:12px;border:1px solid var(--strong);border-radius:8px;background:var(--raised);padding:8px;box-shadow:0 12px 24px #0003;z-index:2}.menu h3{padding:8px}.menu .selection{padding:8px}.menu .selection small{line-height:1.5}.menu .notice{padding:8px;margin:0}.bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;border:1px solid var(--strong);border-radius:8px;background:var(--raised);padding:8px;z-index:5;box-shadow:0 8px 24px #0003;white-space:nowrap}.bar button[aria-pressed=true]{background:var(--text);color:var(--bg)}.research-note{display:flex;justify-content:space-between;gap:24px;margin-top:16px;color:var(--muted);font-size:12px}.state{margin-top:16px;color:var(--muted);font-size:12px}.state pre{white-space:pre-wrap}dialog{background:var(--panel);color:var(--text);border:1px solid var(--strong);border-radius:8px;max-width:400px;padding:24px}dialog::backdrop{background:#0008}dialog p{margin-top:16px}dialog .actions{justify-content:flex-end}
@media(max-width:1000px){.content{padding:24px}.editor-layout{grid-template-columns:120px minmax(0,1fr)}.nav{padding:24px 8px}.frame{grid-template-columns:minmax(0,1fr) var(--sidebar)}.study{padding:16px 16px 100px}.study-head{align-items:start}.study-controls{max-width:200px}.row{align-items:start;flex-wrap:wrap}.row select{max-width:100%}.row .value{margin-left:auto}}
@media(max-width:760px){.frame{display:flex;height:auto;max-height:none;min-height:0;flex-direction:column}.editor{min-height:460px}.sidebar{width:var(--sidebar);max-width:100%;height:640px;align-self:center;border-left:0;border-top:1px solid var(--line)}.editor-layout{min-height:420px}.content{padding:16px}.study-head{flex-direction:column;gap:16px}.study-controls{max-width:none}.research-note{display:block}.bar{max-width:calc(100vw - 24px);white-space:normal}.bar button{padding:8px}.bar .arrows{display:none}}
.content{padding:24px}.code{padding:24px}.content h1,.side-content h1,.hero-value{font-size:15px}.side-content>header>[data-action=back-provider]{display:none}
</style>
<body data-theme="dark">
<main class="study">
 <header class="study-head"><div class="study-title"><span class="eyebrow">PI / DESIGN STUDY 02 · 未接入真实设置</span><h1 id="study-title"></h1><p class="muted" id="study-desc"></p></div><div class="study-controls"><label>侧栏 <select id="width"><option>280</option><option selected>320</option><option>400</option></select></label><label>主题 <select id="theme"><option value="dark">深色</option><option value="light">浅色</option><option value="contrast">高对比</option></select></label><button id="reset" class="secondary">重置</button></div></header>
 <div class="frame" id="frame"></div>
 <div class="research-note"><span id="rationale"></span><span>样本数据 · 操作只影响当前页面 · 中文候选</span></div>
 <details class="state"><summary>研究状态与语义边界</summary><p>布局与导航候选；不验证保存、会话同步、凭据或运行时。真实产品的默认模型同步、原生密钥输入和受信扩展确认语义必须保留。</p><pre id="state"></pre></details>
</main>
<nav class="bar" aria-label="设计方案"><button class="arrows" id="prev" aria-label="上一个方案">←</button><button data-variant="A">A · 独立设置页</button><button data-variant="B">B · 侧栏分层导航</button><button class="arrows" id="next" aria-label="下一个方案">→</button></nav>
<dialog id="confirm"><h2>受信扩展执行</h2><p>扩展可在工具审批覆盖之外执行代码；这不是安全沙箱。</p><p class="muted">此处仅演示确认层级。正式流程仍须由宿主打开文件选择器并请求确认。</p><div class="actions"><button id="cancel">取消</button><button id="confirm-demo" class="secondary">查看模拟状态</button></div></dialog>
<script>
const $=s=>document.querySelector(s),params=new URLSearchParams(location.search);
let variant=params.get('variant')==='B'?'B':'A',page='models',side='overview',open=false,menu=null,provider='Anthropic',selected='Claude Sonnet',mode='受控执行',toast='',filter='',draft='';
const providers=['Anthropic','OpenAI','Google'],connected=new Set(['Anthropic','OpenAI']);
const models=[['Claude Sonnet','Anthropic'],['Claude Opus','Anthropic'],['GPT-5','OpenAI']];
function icon(name){return `<img class="icon" alt="" src="icons/lucide/${name}.svg">`}
function attr(value){return value.replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}
function button(label,action,cls=''){return `<button class="${cls}" data-action="${action}">${label}</button>`}
function nav(){return `<nav class="nav" aria-label="设置分类"><h2>设置</h2>${[['general','通用'],['models','默认模型'],['providers','供应商']].map(([key,name])=>`<button data-page="${key}" aria-current="${page===key?'page':'false'}">${name}</button>`).join('')}</nav>`}
function options(){return models.filter(m=>m.join(' ').toLowerCase().includes(filter.toLowerCase())).map(([name,p])=>`<button class="selection" data-model="${name}" aria-pressed="${selected===name}"><span class="copy"><span>${name}</span><small>${p}</small></span><span class="mark">${icon('check')}</span></button>`).join('')||'<p class="muted empty-space">没有匹配的模型</p>'}
function content(key){
 if(key==='general')return `<header><h1>通用</h1></header><section class="section"><div class="row"><span>界面语言</span><select aria-label="界面语言"><option>简体中文</option></select></div></section>`;
 if(key==='models')return `<header><h1>默认模型</h1></header><section class="section"><h3>已保存的默认选择</h3><div class="hero-value">${selected}</div><input class="search" id="model-search" aria-label="搜索模型" placeholder="搜索模型…" value="${attr(filter)}"><div id="model-results">${options()}</div></section><div class="line"></div><button class="row setting-link" data-page="providers"><span>管理供应商</span><span class="value">${icon('chevron-right')}</span></button>`;
 if(key==='providers')return `<header><h1>供应商</h1></header><section>${providers.map(p=>`<button class="row setting-link" data-provider="${p}"><span class="provider-name"><span class="monogram">${p[0]}</span><span>${p}</span></span><span class="value"><span class="status">${connected.has(p)?'已配置':'未配置'}</span>${icon('chevron-right')}</span></button>`).join('')}</section>`;
 return `<header>${button(icon('arrow-left'),'back-provider','iconbtn')}<h1>${provider}</h1></header><div class="provider-detail"><div class="row"><span>API 密钥</span><span class="status">${connected.has(provider)?'已配置':'未配置'}</span></div><div class="actions">${button(connected.has(provider)?'更新 API 密钥':'添加 API 密钥','key','secondary')}${connected.has(provider)?button('移除凭证','remove','muted'):''}</div>${toast?`<p class="notice" role="status">${toast}</p>`:''}</div>`;
}
function overview(){return `<h1 class="page-title">设置</h1>${[['models','默认模型',selected],['providers','供应商',`${connected.size} 个已配置`],['general','通用','简体中文']].map(([key,title,value])=>`<button class="overview-link" data-page="${key}"><span class="copy"><span>${title}</span><small>${value}</small></span>${icon('chevron-right')}</button>`).join('')}`}
function popup(){if(!menu)return '';return `<div class="menu" role="region" aria-label="${menu==='model'?'当前会话模型':'执行模式'}">${menu==='model'?`<h3>当前会话模型 · 布局示意</h3>${models.map(([m,p])=>`<button class="selection" data-action="close-menu"><span class="copy">${m}<small>${p}</small></span></button>`).join('')}`:`<h3>执行模式</h3><button class="selection" data-action="controlled" aria-pressed="${mode==='受控执行'}"><span class="copy">受控执行<small>覆盖的工具需审批；不加载第三方扩展。</small></span></button><button class="selection" data-action="trusted" aria-pressed="${mode==='受信执行'}"><span class="copy">受信执行<small>显式加载扩展；扩展代码可绕过工具审批覆盖。</small></span></button><p class="notice">两种模式都不是安全沙箱。</p>`}</div>`}
function chat(){return `<header class="side-head"><span>实现会话搜索</span><div>${button(icon('clock'),'history','iconbtn')}${button(icon('settings'),'settings','iconbtn')}</div></header><div class="chat-body"><div class="message">给会话列表增加标题搜索。</div><div class="reply">我会先检查现有列表和筛选逻辑，再把搜索接入当前视图。<br><br><span class="muted">已检查 3 个文件</span></div></div>${popup()}<div class="draft"><textarea aria-label="草稿" placeholder="继续描述你的想法…"></textarea><div class="draft-tools">${button('Claude Sonnet '+icon('chevron-down'),'model')}${button(icon('shield-check')+mode,'mode')}${button(icon('arrow-up'),'send','send')}</div></div><div class="footnote">${mode==='受控执行'?'工具需审批 · 非安全沙箱':'受信扩展 · 审批覆盖有限'}</div>`}
function render(){
 $('#study-title').textContent=variant==='A'?'把设置交还给工作区':'让侧栏一次只承载一项任务';
 $('#study-desc').textContent=variant==='A'?'独立设置标签页 × 保留聊天 × 会话操作留在输入区':'全幅设置首页 × 分类进入详情 × 返回继续聊天';
 $('#rationale').textContent=variant==='A'?'A：设置获得独立空间；不再通过遮罩压住对话。':'B：保持侧栏单一宿主；以导航深度换取清晰与空间。';
 const editor=variant==='A'?`<div class="tabs"><span class="tab">session-list.tsx</span><span class="tab active">Pi · 设置</span></div><div class="editor-layout">${nav()}<section class="content">${content(page)}</section></div>`:`<div class="tabs"><span class="tab active">session-list.tsx</span></div><div class="code"><span class="muted">// 当前编辑位置保持可见</span>\n\n<span class="bright">export function SessionList() {</span>\n  const sessions = useSessions();\n\n  return (\n    &lt;SessionHistory\n      sessions={sessions}\n    /&gt;\n  );\n<span class="bright">}</span></div>`;
 const sidebar=variant==='B'&&open?`<header class="side-head"><span class="leading">${button(icon('arrow-left'),'back','iconbtn')}<span>${side==='overview'?'返回聊天':'设置'}</span></span>${button(icon('x'),'close','iconbtn')}</header><div class="side-content">${side==='overview'?overview():content(side)}</div>`:chat();
 $('#frame').innerHTML=`<section class="editor">${editor}</section><aside class="sidebar">${sidebar}</aside>`;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));
 document.querySelectorAll('[data-action="settings"]').forEach(b=>b.setAttribute('aria-label','打开设置'));
 document.querySelectorAll('[data-action="history"]').forEach(b=>b.setAttribute('aria-label','历史示意'));
 document.querySelectorAll('[data-action="send"]').forEach(b=>{b.setAttribute('aria-label','发送未接入');b.disabled=true});
 document.querySelectorAll('[data-action="close"]').forEach(b=>b.setAttribute('aria-label','返回聊天'));
 document.querySelectorAll('[data-action="back"]').forEach(b=>b.setAttribute('aria-label','返回'));
 document.querySelectorAll('[data-action="back-provider"]').forEach(b=>b.setAttribute('aria-label','返回供应商'));
 $('#state').textContent=JSON.stringify({variant,page,side,open,selected,connected:[...connected],mode,menu},null,2);
 const search=$('#model-search');if(search)search.oninput=()=>{filter=search.value;$('#model-results').innerHTML=options()};
 const textarea=$('textarea');if(textarea){textarea.value=draft;textarea.oninput=()=>{draft=textarea.value}};
 const popupElement=$('.menu');if(popupElement){const bottom=$('.draft').offsetHeight+$('.footnote').offsetHeight+32;popupElement.style.bottom=bottom+'px';popupElement.style.maxHeight=Math.max(120,$('.sidebar').clientHeight-bottom-56)+'px';popupElement.style.overflowY='auto'}
}
function change(v){variant=v;open=v==='B';side='overview';menu=null;filter='';let url=new URL(location);url.searchParams.set('variant',v);history.replaceState(null,'',url);render()}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.variant){change(b.dataset.variant);return}if(b.dataset.page){page=b.dataset.page;side=page;toast='';filter='';render();return}if(b.dataset.provider){provider=b.dataset.provider;page='provider';side='provider';toast='';render();return}if(b.dataset.model){selected=b.dataset.model;render();return}const a=b.dataset.action;if(!a)return;if(a==='settings'){open=true;side='overview';menu=null}if(a==='back'){if(side==='provider'){side='providers';page='providers'}else if(side==='overview')open=false;else side='overview'}if(a==='close')open=false;if(a==='back-provider'){page='providers';side='providers';toast=''}if(a==='key')toast='演示：正式产品在宿主窗口输入密钥。';if(a==='remove'){connected.delete(provider);toast='已移除示例凭据。'}if(a==='mode')menu=menu==='mode'?null:'mode';if(a==='model')menu=menu==='model'?null:'model';if(a==='close-menu')menu=null;if(a==='controlled'){mode='受控执行';menu=null}if(a==='trusted'){$('#confirm').showModal();return}if(a==='history')return;render()});
$('#cancel').onclick=()=>$('#confirm').close();$('#confirm-demo').onclick=()=>{mode='受信执行';menu=null;$('#confirm').close();render()};
$('#prev').onclick=$('#next').onclick=()=>change(variant==='A'?'B':'A');$('#width').onchange=e=>document.documentElement.style.setProperty('--sidebar',e.target.value+'px');$('#theme').onchange=e=>document.body.dataset.theme=e.target.value;$('#reset').onclick=()=>location.reload();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#confirm').open){menu=null;if(open)open=false;render()}if(['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.closest('input,textarea,select,[contenteditable],dialog')){e.preventDefault();change(variant==='A'?'B':'A')}});
if(variant==='B')open=true;render();
</script>
</body></html>
